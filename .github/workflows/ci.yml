name: IBVAP Edge Platform CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Core Architecture & Systems
        run: npm test

      - name: Edge Node Smoke Test (HTTP Endpoint Health Check)
        run: |
          node server/server.js &
          SERVER_PID=$!
          sleep 4
          curl --fail http://127.0.0.1:3000/api/cameras || exit 1
          curl --fail http://127.0.0.1:3000/api/data-sources || exit 1
          curl --fail http://127.0.0.1:3000/api/governance || exit 1
          kill $SERVER_PID
